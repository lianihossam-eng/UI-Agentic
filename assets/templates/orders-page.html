<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--gap:24px;--pad:16px} *{box-sizing:border-box} body{margin:0;font:14px/1.5 system-ui}
  .shell{display:flex;gap:var(--gap)} .sidebar{width:264px;background:#f1f5f9;min-height:100vh}
  .main{flex:1;padding:var(--pad)} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
  .card{border:1px solid #e2e8f0;border-radius:8px;padding:16px} .card h3{margin:0 0 8px;font-size:16px}
  button{padding:8px 16px;min-width:44px;min-height:44px}
  .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.4)} .modal[open]{display:grid}
  .modal .box{background:white;padding:24px;border-radius:12px;width:480px}

  @media (max-width: 767px){
    .shell{flex-direction:column}
    .sidebar{width:100%;min-height:auto;padding:12px}
    .grid{grid-template-columns:1fr !important}
  }
</style>
</head><body>
<div class="shell"><aside class="sidebar" data-testid="sidebar">Sidebar</aside>
<main class="main" data-testid="main">
  <h1>Orders</h1>
  <div class="grid" data-testid="grid">
    <div class="card" data-testid="card"><h3>Order #1</h3><button data-testid="btn">Voir</button></div>
    <div class="card" data-testid="card"><h3>Order #2 long title that wraps and tests text geometry fragments</h3><button data-testid="btn">Voir</button></div>
    <div class="card" data-testid="card"><h3>Order #3</h3><button data-testid="btn">Voir</button></div>
  </div>
</main></div>
<div class="modal" data-testid="modal"><div class="box" role="dialog" aria-modal="true"><h2>Detail</h2><button data-testid="close">Fermer</button></div></div>
</body></html>
