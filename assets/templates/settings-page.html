<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--gap:24px;--pad:16px}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui}.shell{display:flex;gap:24px}.sidebar{width:264px;background:#f1f5f9;min-height:100vh}.main{flex:1;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{border:1px solid #e2e8f0;border-radius:8px;padding:16px}button{padding:8px 16px;min-width:44px;min-height:44px}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.4);padding:16px}.modal[open]{display:grid}.modal .box{background:white;padding:24px;border-radius:12px;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
  @media (max-width: 767px){
    .shell{flex-direction:column}
    .sidebar{width:100%;min-height:auto;padding:16px}
    .grid{grid-template-columns:1fr !important}
  }
</style>
</head><body>
<div class="shell"><aside class="sidebar" data-testid="sidebar">Sidebar</aside>
<main class="main" data-testid="main">
  <h1>Settings</h1>
  <button data-testid="open-modal">Open confirmation</button>
  <div class="grid" data-testid="grid">
    <div class="card" data-testid="card"><h3>Profile</h3><button data-testid="btn">Edit</button></div>
    <div class="card" data-testid="card"><h3>Notifications</h3><button data-testid="btn">Configure</button></div>
  </div>
</main></div>
<div class="modal" data-testid="modal"><div class="box" role="dialog" aria-modal="true" aria-labelledby="settings-dialog-title"><h2 id="settings-dialog-title">Confirm</h2><button data-testid="close">OK</button></div></div>
<script>
(() => {
  const shell=document.querySelector('.shell');
  const modal=document.querySelector('[data-testid="modal"]');
  const opener=document.querySelector('[data-testid="open-modal"]');
  const closer=document.querySelector('[data-testid="close"]');
  const open=() => {
    shell.setAttribute('inert','');
    modal.setAttribute('open','');
    closer.focus();
  };
  const close=() => {
    modal.removeAttribute('open');
    shell.removeAttribute('inert');
    opener.focus();
  };
  opener.addEventListener('click', open);
  closer.addEventListener('click', close);
  modal.addEventListener('keydown', event => {
    if(event.key==='Tab'){
      event.preventDefault();
      closer.focus();
    } else if(event.key==='Escape'){
      event.preventDefault();
      close();
    }
  });
})();
</script>
</body></html>
