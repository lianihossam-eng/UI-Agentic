name: proof-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install hashed CI dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: Run proof-gate unit tests
        run: python -m unittest discover -s tests -v

  replay:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install hashed CI dependencies + Chromium
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Fault injection
        run: python scripts/fault_injection.py

      - name: Generate semantic current-run evidence
        run: python scripts/capture_current_run_evidence.py

      - name: Diagnose replay obligations on capture failure
        if: failure()
        run: python scripts/diagnose_replay.py

      - name: Capture actual runtime binary and font identity
        run: python scripts/capture_runtime_identity.py

      - name: Build record-bound traceability
        run: python scripts/build_traceability_report.py

      - name: Strict obligation and proof-level gate
        run: python scripts/strict_obligation_gate.py

      - name: Strict 13-mutant adequacy gate
        run: python scripts/strict_mutation_gate.py

      - name: Strict runtime identity gate before attestation
        run: python scripts/strict_runtime_identity_gate.py

      - name: Enforce complete visual contract
        run: python scripts/enforce_visual_contract.py

      - name: Run GOAL verification against current-run reports
        run: |
          set -o pipefail
          python run_goal_verify.py | tee reports/final_result.json

      - name: Strict visual acceptance gate
        run: python scripts/strict_visual_gate.py

      - name: Provenance fail-closed tests
        run: |
          python -c "
          import json, hashlib, pathlib, subprocess
          base=pathlib.Path('.')

          def reh(data):
              copy={k:v for k,v in data.items() if k not in ('report_hash','report_hash_algo')}
              data['report_hash']=hashlib.sha256(json.dumps(copy,sort_keys=True).encode()).hexdigest()[:16]
              return data

          def reartifact(data):
              data.pop('artifact_hash', None)
              data['artifact_hash']=hashlib.sha256(json.dumps(data,sort_keys=True).encode()).hexdigest()[:16]
              return data

          p=base/'reports/traceability_report.json'
          orig=json.loads(p.read_text())
          tamper=json.loads(p.read_text())
          tamper['scenario_digest']='0000000000000000'
          p.write_text(json.dumps(reh(tamper), indent=2, sort_keys=True))
          r=subprocess.run(['python','run_goal_verify.py'], capture_output=True)
          assert r.returncode==2, 'scenario_digest tamper should block'
          print('scenario_digest tamper blocked OK')
          p.write_text(json.dumps(orig, indent=2, sort_keys=True))

          p2=base/'reports/mutation_report.json'
          orig2=json.loads(p2.read_text())
          tamper2=json.loads(p2.read_text())
          tamper2['evidence_root']='ffffffffffffffff'
          p2.write_text(json.dumps(reh(tamper2), indent=2, sort_keys=True))
          r2=subprocess.run(['python','run_goal_verify.py'], capture_output=True)
          assert r2.returncode==2, 'evidence_root tamper should block'
          print('evidence_root tamper blocked OK')
          p2.write_text(json.dumps(orig2, indent=2, sort_keys=True))

          pm=base/'reports/mutation_report.json'
          origm=json.loads(pm.read_text())
          tamperm=json.loads(pm.read_text())
          tamperm['details']=tamperm['details'][:-1]
          tamperm['mutants_total']=len(tamperm['details'])
          tamperm['detected']=len(tamperm['details'])
          pm.write_text(json.dumps(reh(tamperm), indent=2, sort_keys=True))
          rm=subprocess.run(['python','scripts/strict_mutation_gate.py'], capture_output=True)
          assert rm.returncode==2, 'deleted required mutant should block'
          print('required mutant deletion blocked OK')
          pm.write_text(json.dumps(origm, indent=2, sort_keys=True))

          p3=base/'reports/traceability_report.json'
          orig3=json.loads(p3.read_text())
          tamper3=json.loads(p3.read_text())
          tamper3['mapping']=tamper3['mapping'][:-1]
          tamper3['traced_obligations']=len(tamper3['mapping'])
          p3.write_text(json.dumps(reh(tamper3), indent=2, sort_keys=True))
          r3=subprocess.run(['python','scripts/strict_obligation_gate.py'], capture_output=True)
          assert r3.returncode==2, 'deleted traceability entry should block'
          print('traceability deletion blocked OK')
          p3.write_text(json.dumps(orig3, indent=2, sort_keys=True))

          p4=base/'reports/traceability_report.json'
          orig4=json.loads(p4.read_text())
          tamper4=json.loads(p4.read_text())
          tamper4['mapping'][0]['evidence_key']='0000000000000000'
          p4.write_text(json.dumps(reh(tamper4), indent=2, sort_keys=True))
          r4=subprocess.run(['python','scripts/strict_obligation_gate.py'], capture_output=True)
          assert r4.returncode==2, 'traceability evidence-key tamper should block'
          print('traceability evidence-key tamper blocked OK')
          p4.write_text(json.dumps(orig4, indent=2, sort_keys=True))

          current=base/'reports/current_run_evidence.json'
          origc=json.loads(current.read_text())
          tamperc=json.loads(current.read_text())
          tamperc['records'][0]['scenario']['scenario_id']='forged-obligation'
          current.write_text(json.dumps(reartifact(tamperc), indent=2, sort_keys=True))
          rc=subprocess.run(['python','scripts/strict_obligation_gate.py'], capture_output=True)
          assert rc.returncode==2, 'current-run scenario-id tamper should block'
          print('current-run scenario-id tamper blocked OK')
          current.write_text(json.dumps(origc, indent=2, sort_keys=True))

          tamperc2=json.loads(current.read_text())
          tamperc2['records'][0]['result']['constraint']='forged-rule'
          current.write_text(json.dumps(reartifact(tamperc2), indent=2, sort_keys=True))
          rc2=subprocess.run(['python','scripts/strict_obligation_gate.py'], capture_output=True)
          assert rc2.returncode==2, 'current-run result constraint tamper should block'
          print('current-run result constraint tamper blocked OK')
          current.write_text(json.dumps(origc, indent=2, sort_keys=True))

          runtime=base/'reports/runtime_identity.json'
          origr=json.loads(runtime.read_text())
          tamperr=json.loads(runtime.read_text())
          tamperr['browser']['sha256']='0'*64
          runtime.write_text(json.dumps(reh(tamperr), indent=2, sort_keys=True))
          rr=subprocess.run(['python','scripts/strict_runtime_identity_gate.py'], capture_output=True)
          assert rr.returncode==2, 'runtime binary identity tamper should block'
          print('runtime binary identity tamper blocked OK')
          runtime.write_text(json.dumps(origr, indent=2, sort_keys=True))

          visual=base/'reports/visual_review.json'
          origv=json.loads(visual.read_text())
          tamperv=json.loads(visual.read_text())
          first_name=sorted(tamperv['screenshot_digests'])[0]
          tamperv['screenshot_digests'][first_name]='0000000000000000'
          visual.write_text(json.dumps(reh(tamperv), indent=2, sort_keys=True))
          rv=subprocess.run(['python','scripts/strict_visual_gate.py'], capture_output=True)
          assert rv.returncode==2, 'visual screenshot digest tamper should block'
          print('visual screenshot tamper blocked OK')
          visual.write_text(json.dumps(origv, indent=2, sort_keys=True))

          r5=subprocess.run(['python','run_goal_verify.py'], capture_output=True)
          assert r5.returncode==0, 'restored current-run evidence should pass'
          r6=subprocess.run(['python','scripts/strict_obligation_gate.py'], capture_output=True)
          assert r6.returncode==0, 'restored obligation evidence should pass'
          r7=subprocess.run(['python','scripts/strict_mutation_gate.py'], capture_output=True)
          assert r7.returncode==0, 'restored mutation evidence should pass'
          r8=subprocess.run(['python','scripts/strict_runtime_identity_gate.py'], capture_output=True)
          assert r8.returncode==0, 'restored runtime identity should pass'
          r9=subprocess.run(['python','scripts/strict_visual_gate.py'], capture_output=True)
          assert r9.returncode==0, 'restored visual evidence should pass'
          print('provenance + obligation + mutation + runtime + visual tamper tests all pass')
          "

      - name: Recheck strict obligation gate after tamper tests
        run: python scripts/strict_obligation_gate.py

      - name: Recheck strict mutation gate after tamper tests
        run: python scripts/strict_mutation_gate.py

      - name: Recheck runtime identity after tamper tests
        run: python scripts/strict_runtime_identity_gate.py

      - name: Remove provisional legacy attestation
        run: rm -f .goal_attestation.json

      - name: Pre-attestation current-run gate
        run: python scripts/pre_attestation_gate.py

      - name: Finalize self-contained attestation
        run: python scripts/finalize_current_run_attestation.py

      - name: Strict current-run provenance gate
        run: python scripts/strict_provenance_gate.py

      - name: Strict runtime identity + attestation gate
        run: python scripts/strict_runtime_identity_gate.py

      - name: Strict Trusted Verification Kernel gate
        run: python scripts/strict_kernel_attestation_gate.py

      - name: Check final attestation LOCKED
        run: |
          python -c "import json; d=json.load(open('.goal_attestation.json')); assert d['verdict']=='LOCKED'; assert d['attestation']['final_gate']['passed'] is True; assert d['attestation']['runtime_identity_root']; print('LOCKED', d['digest'], d['attestation']['evidence_root'], d['attestation']['runtime_identity_root'], d['attestation']['trusted_kernel_digest'])"

      - name: Upload final/current diagnostic artefact bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-agentic-bundle-${{ github.sha }}
          path: |
            .goal_attestation.json
            reports/
            reports/screenshots/
            reports/environment_manifest.json
          include-hidden-files: true
          retention-days: 90
