name: proof-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml playwright
      - name: Run proof-gate unit tests
        run: python -m unittest discover -s tests -v

  replay:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps + Chromium
        run: |
          pip install pyyaml playwright
          python -m playwright install --with-deps chromium
      - name: Validate report hashes
        run: |
          python -c "
          import json, hashlib, pathlib, sys
          base=pathlib.Path('.')
          for name in ['traceability_report','assumptions_report','parent_contract_report','cross_layer_report','visual_review','regression_report','mutation_report']:
              p=base/'reports'/f'{name}.json'
              data=json.loads(p.read_text())
              exp=data.get('report_hash')
              copy={k:v for k,v in data.items() if k not in ('report_hash','report_hash_algo')}
              calc=hashlib.sha256(json.dumps(copy,sort_keys=True).encode()).hexdigest()[:16]
              assert calc==exp, f'hash mismatch {name}: {calc} != {exp}'
              assert data.get('status')!='PENDING', f'pending {name}'
              print(f'OK {name} {exp}')
          "
      - name: Fault injection
        run: python scripts/fault_injection.py
      - name: Run GOAL verification (artefact-derived gates)
        run: python run_goal_verify.py
      - name: Check attestation LOCKED
        run: |
          python -c "import json; d=json.load(open('.goal_attestation.json')); assert d['verdict']=='LOCKED', d; assert d['attestation']['final_gate']['passed'] is True; print('LOCKED', d['digest'], d['attestation']['evidence_root'])"
      - name: Reproducibility A/B
        run: |
          python run_goal_verify.py > /tmp/a.json
          python run_goal_verify.py > /tmp/b.json
          python -c "import json; a=json.load(open('/tmp/a.json')); b=json.load(open('/tmp/b.json')); assert a['evidence_root']==b['evidence_root'], (a['evidence_root'], b['evidence_root']); assert a['coverage']==b['coverage']; print('reproducible', a['evidence_root'])"
