[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-agentic"
version = "0.2.0"
description = "Evidence-driven UI stabilization and verification with explicit contracts, browser measurements, and fail-closed proof gates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright", "pyyaml"]
license = {text = "MIT"}

[project.scripts]
ui-agentic = "ui_agentic.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ui_agentic*", "core*", "gvh*"]
namespaces = true
